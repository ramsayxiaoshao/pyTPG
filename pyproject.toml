[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pytpg"
version = "0.5.0"
description = "A modular research framework for Tangled Program Graphs"
readme = "README.md"
authors = [{name = "pyTPG contributors"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["evolutionary-computation", "reinforcement-learning", "tangled-program-graphs"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.0"]

[project.urls]
Homepage = "https://github.com/ramsayxiaoshao/pyTPG"
Repository = "https://github.com/ramsayxiaoshao/pyTPG"
Documentation = "https://github.com/ramsayxiaoshao/pyTPG/tree/main/docs"
Issues = "https://github.com/ramsayxiaoshao/pyTPG/issues"

[project.scripts]
pytpg-visualize = "pytpg.visualization.cli:main"

[project.optional-dependencies]
visualization = ["networkx>=3.2", "plotly>=5.20"]
gymnasium = ["gymnasium>=1.0,<2"]
dev = [
    "build>=1.2",
    "hatchling>=1.26",
    "twine>=6.1",
    "pyright[nodejs]>=1.1.380",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytpg"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["pytpg"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
reportUnnecessaryIsInstance = "none"
typeCheckingMode = "strict"
